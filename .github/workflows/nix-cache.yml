name: Nix binary cache

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cache:
    # Configure a private cache name as a repository variable before enabling.
    if: vars.CACHIX_CACHE != ''
    name: Cache ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-22.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check cache configuration
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo 'Add the CACHIX_AUTH_TOKEN repository secret for your private cache.' >&2
            exit 1
          fi
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Build the exact flake package used by installations
        env:
          TEXTAMP_SYSTEM: ${{ matrix.system }}
        run: nix build --max-jobs 1 --cores 2 --no-update-lock-file -L ".#packages.$TEXTAMP_SYSTEM.default"
      - name: Test built package
        run: python3 tests/fixtures/folder_tui_smoke.py result/bin/textamp --browse-only
      - name: Push runtime closure
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
        run: cachix push "$CACHIX_CACHE" result
